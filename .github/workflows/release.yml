name: Build & Release APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the Play service-account secret is added; the publish step is skipped while empty.
      PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/upload-keystore.jks

      - name: Write signing config
        run: |
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Build release APK + AAB
        working-directory: app
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Name the artifact
        run: cp app/build/app/outputs/flutter-apk/app-release.apk flutster-${{ github.ref_name }}.apk

      # Only when a tag is pushed; workflow_dispatch just builds (a signing smoke-test).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: flutster-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Skipped until PLAY_SERVICE_ACCOUNT_JSON exists, so tags keep working before Play is wired up.
      # No mappingFile: release builds keep R8 off (isMinifyEnabled=false) for the Spotify SDK.
      - name: Publish AAB to Google Play (production)
        if: startsWith(github.ref, 'refs/tags/') && env.PLAY_SA_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SA_JSON }}
          packageName: com.nicsilver.flutster
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
